# Starter NVIDIA TAO RT-DETR training config scaffold.
# Adjust keys/structure based on exact TAO version in your DGX environment.

results_dir: /workspace/experiments/rtdetr_ppe_stage1
seed: 42

model:
  backbone: resnet_50
  num_classes: 14
  pretrained_model_path: /workspace/pretrained/<rtdetr_pretrained>.pth

dataset:
  format: coco
  train_data_sources:
    - image_dir: /workspace/data/final/train/images
      json_file: /workspace/data/final/annotations/train.json
  val_data_sources:
    - image_dir: /workspace/data/final/val/images
      json_file: /workspace/data/final/annotations/val.json
  test_data_sources:
    - image_dir: /workspace/data/final/test/images
      json_file: /workspace/data/final/annotations/test.json
  workers: 8
  pin_memory: true

train:
  batch_size: 16
  num_epochs: 80
  checkpoint_interval: 5
  validation_interval: 1
  optim:
    type: AdamW
    lr: 0.0001
    weight_decay: 0.0001

evaluate:
  batch_size: 16

inference:
  conf_threshold: 0.25
  nms_threshold: 0.6
